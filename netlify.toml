[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "20"

# Route all non-asset requests through the SSR function
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# Meta Pixel — injected at CDN level into every HTML page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
